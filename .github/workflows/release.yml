name: Release

# Helmsman Linux 自动构建与标签发布流水线：
# - 触发方式：推送符合 v* 语义化版本格式的 Tag（如 v0.1.0）或手动触发
# - 产出：helmsman-app (.deb) 与 helmsman-daemon (.tar.gz)，
#   并通过 shipup-cli 生成带 Ed25519 签名的 latest.json 清单以支持应用自更新。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签（例如 v0.1.0）
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: 校验发布标签与签名凭据
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: 检出标签对应代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: 解析标签并校验工作区版本
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ "$TAG" != v* ]]; then
            echo "::error::发布标签必须以 v 开头，当前为: $TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          WORKSPACE_VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$WORKSPACE_VERSION" != "$VERSION" ]; then
            echo "::error::标签版本 $VERSION 与 workspace 版本 $WORKSPACE_VERSION 不一致"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 校验更新签名私钥
        env:
          SHIPUP_PRIVATE_KEY: ${{ secrets.SHIPUP_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SHIPUP_PRIVATE_KEY:-}" ]; then
            echo "::error::缺少仓库 Secret SHIPUP_PRIVATE_KEY，拒绝发布无法验证的更新清单"
            exit 1
          fi

  changelog:
    name: 生成版本更新日志
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整提交历史
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: 生成当前版本分类 Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_CHANGELOG.md

      - name: 上传 Changelog 临时产物
        uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: RELEASE_CHANGELOG.md

  build-linux:
    name: 构建 Linux 产物 (${{ matrix.arch }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 配置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 启用 Rust 依赖缓存
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.target }}

      - name: 安装 Linux 图形与打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            pkg-config \
            file

      - name: 安装 cargo-deb
        run: cargo install cargo-deb --locked

      - name: 编译 Release 二进制 (桌面端与守护进程)
        run: cargo build --locked --release -p helmsman-app -p helmsman-daemon --target ${{ matrix.target }}

      - name: 构建 DEB 安装包
        run: cargo deb -p helmsman-app --no-build --target ${{ matrix.target }}

      - name: 规整并打包产物
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ROOT_DIR="$(pwd)"
          mkdir -p dist
          DEB="$(find target -path '*/debian/*.deb' -type f | head -n 1)"
          if [ -z "$DEB" ]; then echo "::error::未找到 DEB 产物"; exit 1; fi
          cp "$DEB" "dist/helmsman_${VERSION}_linux_${ARCH}.deb"
          tar -czf "dist/helmsman-daemon_${VERSION}_linux_${ARCH}.tar.gz" \
            -C "${ROOT_DIR}/target/${TARGET}/release" helmsman-daemon \
            -C "${ROOT_DIR}/crates/helmsman-daemon/data" \
            org.freedesktop.Helmsman.policy org.freedesktop.Helmsman.service helmsman.service
          ls -lh dist

      - name: 上传 Linux 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-artifacts
          path: dist/*

  publish:
    name: 生成 Ed25519 清单并发布 GitHub Release
    needs: [prepare, changelog, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: 配置 Rust 稳定版工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 下载产物与更新日志
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-files

      - name: 安装 shipup-cli
        run: cargo install shipup-cli --locked

      - name: 生成 Ed25519 签名清单 latest.json
        env:
          SHIPUP_PRIVATE_KEY: ${{ secrets.SHIPUP_PRIVATE_KEY }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SHIPUP_PRIVATE_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          NOTES="$(cat release-files/RELEASE_CHANGELOG.md)"

          sign_package() {
            local file="$1"
            local target="$2"
            local package_type="$3"
            shift 3
            local filename
            filename="$(basename "$file")"
            local url="https://github.com/${REPO}/releases/download/${TAG}/${filename}"
            shipup-cli release \
              --version "$VERSION" \
              --target "$target" \
              --package "$file" \
              --url "$url" \
              --package-type "$package_type" \
              --key "$KEY_FILE" \
              --manifest release-files/latest.json \
              --notes "$NOTES" \
              "$@"
          }

          sign_package "release-files/helmsman_${VERSION}_linux_amd64.deb" "x86_64-unknown-linux-gnu" installer --require-elevation --wait-for-exit
          sign_package "release-files/helmsman_${VERSION}_linux_arm64.deb" "aarch64-unknown-linux-gnu" installer --require-elevation --wait-for-exit

          EMBEDDED_KEY="$(sed -n 's/.*UPDATE_PUBLIC_KEY: &str = "\([^"]*\)";/\1/p' crates/helmsman-updater/src/lib.rs | head -n 1)"
          shipup-cli verify \
            --manifest release-files/latest.json \
            --package "release-files/helmsman_${VERSION}_linux_amd64.deb" \
            --target "x86_64-unknown-linux-gnu" \
            --public-key "$EMBEDDED_KEY"
          shipup-cli verify \
            --manifest release-files/latest.json \
            --package "release-files/helmsman_${VERSION}_linux_arm64.deb" \
            --target "aarch64-unknown-linux-gnu" \
            --public-key "$EMBEDDED_KEY"

      - name: 发布 GitHub Release 并挂载全部产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Helmsman v${{ needs.prepare.outputs.version }}
          body_path: release-files/RELEASE_CHANGELOG.md
          files: |
            release-files/*.deb
            release-files/*.tar.gz
            release-files/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
