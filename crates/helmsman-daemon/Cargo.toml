[package]
name = "helmsman-daemon"
description = "Helmsman 特权后台服务与事务调度器"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[features]
default = []
# 仅供单元测试/集成测试与 CI 使用：启用 Polkit Mock 与测试命令白名单。
# 发行版打包与生产构建严禁启用本 feature。
test-support = []

[dependencies]
grub-config-parser.workspace = true
grub-boot-reader.workspace = true
grub-distro-adapter.workspace = true
grub-transaction-engine.workspace = true
helmsman-client.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
zbus.workspace = true
zvariant.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
zip.workspace = true

[[test]]
name = "dbus_end_to_end_test"
required-features = ["test-support"]

[[test]]
name = "service_test"
required-features = ["test-support"]
