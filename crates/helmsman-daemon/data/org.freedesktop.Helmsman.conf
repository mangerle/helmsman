<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- 允许 root 进程在系统总线上认领 Helmsman 守护进程服务名 -->
  <policy user="root">
    <allow own="org.freedesktop.Helmsman"/>
  </policy>

  <!-- 允许桌面端非特权用户向服务发送调用并接收信号；实际写操作仍由 Polkit 鉴权把关 -->
  <policy context="default">
    <allow send_destination="org.freedesktop.Helmsman"/>
    <allow receive_sender="org.freedesktop.Helmsman"/>
  </policy>
</busconfig>
