[package]
name = "helmsman-app"
description = "Helmsman 基于 gpui-kit 的原生 Linux 桌面图形界面"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lints]
workspace = true

[dependencies]
gpui-kit = "0.11.0"
helmsman-ui.workspace = true
helmsman-client.workspace = true
helmsman-updater.workspace = true
grub-boot-reader.workspace = true
grub-config-parser.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
zbus.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[package.metadata.deb]
maintainer = "wangle"
section = "admin"
priority = "optional"
depends = "$auto, policykit-1, dbus"
assets = [
    ["target/release/helmsman-app", "usr/bin/", "755"],
    ["../../packaging/linux/helmsman.desktop", "usr/share/applications/helmsman.desktop", "644"],
    ["../../assets/logo.svg", "usr/share/icons/hicolor/scalable/apps/helmsman.svg", "644"],
]

[package.metadata.packager]
name = "Helmsman"
identifier = "org.freedesktop.Helmsman"
icons = ["../../assets/logo.svg"]
